<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Library Book Lending</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; max-width: 820px; margin: 30px auto; padding: 0 15px; }
  h1 { margin-bottom: 4px; }
  .box { border: 1px solid #ccc; border-radius: 8px; padding: 14px; margin: 14px 0; }
  button { padding: 7px 14px; margin: 3px; cursor: pointer; }
  input { padding: 7px; width: 240px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: left; font-size: 14px; }
  th { background: #f0f0f0; }
  .ok { color: green; } .err { color: red; } .info { color: #b36b00; }
  .avail { color: green; font-weight: bold; } .busy { color: #c0392b; font-weight: bold; }
  #status { min-height: 22px; font-weight: bold; }
</style>
</head>
<body>
<h1>Library Book Lending</h1>

<div class="box">
  <button id="connectBtn">Connect Wallet</button>
  <div>Account: <b id="account">not connected</b></div>
  <div>Network: <b id="network">-</b></div>
  <div>Role: <b id="role">-</b></div>
  <div>Librarian: <span id="librarian">-</span></div>
  <div>Contract: <span id="contractAddr">-</span></div>
</div>

<div class="box">
  <h3>Librarian: add a book</h3>
  <input id="titleInput" placeholder="Book title">
  <button id="addBtn">Add Book</button>
</div>

<div class="box">
  <h3>Books</h3>
  <button id="refreshBtn">Refresh</button>
  <table>
    <thead><tr><th>ID</th><th>Title</th><th>Status</th><th>Borrower</th><th>Action</th></tr></thead>
    <tbody id="booksBody"><tr><td colspan="5">Connect wallet to load books</td></tr></tbody>
  </table>
</div>

<div class="box">
  <h3>Transaction status</h3>
  <div id="status"></div>
  <h3>Events</h3>
  <ul id="events"></ul>
</div>

<script>
// ====== THAY ĐỊA CHỈ CONTRACT CỦA BẠN VÀO ĐÂY ======
const CONTRACT_ADDRESS = "0x51E9a5B1c97a3eb2EC7ec85c44af2A630c5Dafa4";
// ====================================================

const ABI = [
  "function librarian() view returns (address)",
  "function addBook(string title) returns (uint256)",
  "function borrowBook(uint256 id)",
  "function returnBook(uint256 id)",
  "function getAllBooks() view returns (tuple(uint256 id, string title, address borrower, bool available)[])",
  "function bookCount() view returns (uint256)",
  "event BookAdded(uint256 indexed id, string title, address indexed librarian)",
  "event BookBorrowed(uint256 indexed id, address indexed borrower)",
  "event BookReturned(uint256 indexed id, address indexed borrower)"
];

let provider, signer, contract, account, librarianAddr;
const $ = (id) => document.getElementById(id);
const ZERO = "0x0000000000000000000000000000000000000000";

function setStatus(msg, cls) { $("status").className = cls || ""; $("status").textContent = msg; }
function short(a) { return a.slice(0, 6) + "..." + a.slice(-4); }
function errMsg(e) {
  const m = (e.reason || (e.error && e.error.message) || (e.data && e.data.message) || e.message || String(e));
  const r = m.match(/reverted with reason string '([^']+)'/) || m.match(/revert (.+?)["']?(,|$)/);
  return r ? r[1] : m;
}

async function connect() {
  try {
    if (!window.ethereum) { setStatus("MetaMask not found. Install MetaMask first.", "err"); return; }
    provider = new ethers.providers.Web3Provider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = provider.getSigner();
    account = await signer.getAddress();
    const net = await provider.getNetwork();
    contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
    librarianAddr = await contract.librarian();

    $("account").textContent = account;
    $("network").textContent = "chainId " + net.chainId;
    $("librarian").textContent = librarianAddr;
    $("contractAddr").textContent = CONTRACT_ADDRESS;
    $("role").textContent = account.toLowerCase() === librarianAddr.toLowerCase() ? "Librarian" : "User";

    contract.on("BookAdded", (id, title) => logEvent("BookAdded: #" + id + " \"" + title + "\""));
    contract.on("BookBorrowed", (id, who) => logEvent("BookBorrowed: #" + id + " by " + short(who)));
    contract.on("BookReturned", (id, who) => logEvent("BookReturned: #" + id + " by " + short(who)));

    setStatus("Connected", "ok");
    await loadBooks();
  } catch (e) { setStatus("Connect error: " + errMsg(e), "err"); }
}

function logEvent(text) {
  const li = document.createElement("li");
  li.textContent = new Date().toLocaleTimeString() + " - " + text;
  $("events").prepend(li);
  loadBooks();
}

async function loadBooks() {
  if (!contract) return;
  try {
    const books = await contract.getAllBooks();
    const body = $("booksBody");
    body.innerHTML = "";
    if (books.length === 0) { body.innerHTML = "<tr><td colspan='5'>No books yet</td></tr>"; return; }
    books.forEach((b) => {
      const tr = document.createElement("tr");
      const avail = b.available;
      const borrower = avail ? "-" : (b.borrower.toLowerCase() === account.toLowerCase() ? b.borrower + " (you)" : b.borrower);
      tr.innerHTML =
        "<td>" + b.id + "</td><td>" + b.title + "</td>" +
        "<td class='" + (avail ? "avail" : "busy") + "'>" + (avail ? "Available" : "Borrowed") + "</td>" +
        "<td>" + borrower + "</td>" +
        "<td><button onclick='borrow(" + b.id + ")'>Borrow</button>" +
        "<button onclick='giveBack(" + b.id + ")'>Return</button></td>";
      body.appendChild(tr);
    });
  } catch (e) { setStatus("Load error: " + errMsg(e), "err"); }
}

async function send(label, fn) {
  try {
    setStatus(label + ": waiting for MetaMask confirmation...", "info");
    const tx = await fn();
    setStatus(label + ": pending, tx " + short(tx.hash), "info");
    await tx.wait();
    setStatus(label + ": SUCCESS (tx " + tx.hash + ")", "ok");
    await loadBooks();
  } catch (e) { setStatus(label + ": FAILED - " + errMsg(e), "err"); }
}

function addBook() {
  const t = $("titleInput").value.trim();
  send("Add book", () => contract.addBook(t));
  $("titleInput").value = "";
}
function borrow(id) { send("Borrow #" + id, () => contract.borrowBook(id)); }
function giveBack(id) { send("Return #" + id, () => contract.returnBook(id)); }

$("connectBtn").onclick = connect;
$("addBtn").onclick = addBook;
$("refreshBtn").onclick = loadBooks;

if (window.ethereum) {
  window.ethereum.on("accountsChanged", () => location.reload());
  window.ethereum.on("chainChanged", () => location.reload());
}
</script>
</body>
</html>
